# Static SPA server for the production build. Deep links (e.g.
# /portfolio/risk, /quant/backtest) have no matching file on disk — fall
# back to index.html so client-side routing can take over.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
