# Demo variant of nginx/nginx.conf (mounted over it by compose.demo.yml).
# Adds: request-rate and websocket-connection limits per client, 405 on
# non-read methods outside /api/ (the app answers 403 read_only_demo on /api/),
# no server version string, 404 for /fava/ (fava does not run in the demo).
# Upstreams are resolved per request through Docker's embedded DNS, so a
# recreated backend/frontend container (new IP) never leaves a stale address.

worker_processes 2;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate-limit / connection-limit key: Cf-Connecting-Ip (set by Cloudflare),
    # falling back to the socket peer for direct LAN requests. The header is
    # trustworthy ONLY because this nginx port is reachable solely through the
    # tunnel/edge-proxy path (DEMO_BIND_ADDR on the LAN, never forwarded on the
    # router); anyone who can reach the port directly can spoof it.
    map $http_cf_connecting_ip $rl_client {
        default $http_cf_connecting_ip;
        ""      $binary_remote_addr;
    }
    limit_req_zone $rl_client zone=demo_api:10m rate=20r/s;
    limit_conn_zone $rl_client zone=demo_ws:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Docker's embedded DNS; short validity so recreated containers are picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Variables (not upstream blocks) make nginx re-resolve at request time.
        set $be_api      fastapi-backend:8000;
        set $be_frontend react-frontend:80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Target of the edge's method-not-allowed fallback router.
        location = /__405 {
            return 405;
        }

        location /api/ {
            client_max_body_size 512k;
            limit_req zone=demo_api burst=40 nodelay;
            proxy_pass http://$be_api;
        }

        # Price websocket: a few sockets per client (the app also caps the total
        # and the lifetime).
        location /api/v1/ws/ {
            limit_req zone=demo_api burst=40 nodelay;
            limit_conn demo_ws 2;
            proxy_read_timeout 1000s;
            proxy_pass http://$be_api;
        }

        # Fava is not started in the demo; nothing is proxied under this path.
        location /fava/ {
            return 404;
        }

        location / {
            if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
            proxy_pass http://$be_frontend;
        }
    }
}
