# Demo variant of nginx/nginx.conf (mounted over it by compose.demo.yml).
# Adds: request-rate limit on /api/, 405 on non-read methods outside /api/
# (the app answers 403 read_only_demo on /api/), no server version string.
# The edge proxy sets X-Forwarded-For from the client IP header (DEMO-SPEC §3).

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate-limit key: first X-Forwarded-For hop (the real client at the edge),
    # falling back to the socket peer for direct LAN requests.
    map $http_x_forwarded_for $rl_client {
        default                  $binary_remote_addr;
        "~^(?<first>[^, ]+)"    $first;
    }
    limit_req_zone $rl_client zone=demo_api:10m rate=20r/s;
    limit_req_status 429;

    upstream fastapi_backend {
        server fastapi-backend:8000;
    }

    upstream react_frontend {
        server react-frontend:80;
    }

    upstream fava_app {
        server fava:5001;
    }

    server {
        listen 80;
        server_name _;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Target of the edge's method-not-allowed fallback router.
        location = /__405 {
            return 405;
        }

        location /api/ {
            client_max_body_size 512k;
            limit_req zone=demo_api burst=40 nodelay;
            proxy_pass http://fastapi_backend;
        }

        location = /_auth {
            internal;
            proxy_pass http://fastapi_backend/api/v1/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }
        location /fava/ {
            if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
            auth_request /_auth;
            error_page 401 403 = @denied;
            proxy_pass http://fava_app;
        }
        location @denied {
            return 302 /;
        }

        location / {
            if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
            proxy_pass http://react_frontend;
        }
    }
}
