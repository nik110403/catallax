# Hosted public demo overlay (DEMO-SPEC C7b / §4, §5.4).
# Use ONLY through ./compose.sh, which pins project name, file order and flags:
#   docker compose -p catallax-demo -f docker-compose.yml -f deploy/demo/compose.demo.yml ...
# Needs Docker Compose >= 2.24.4 (`!override`; compose.sh enforces it). Own project, own networks and volumes,
# no external network, no docker socket, no bind mount outside the stack dir.
name: catallax-demo

x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true

# `env_file: .env` hands every key of the stack env file to a service. The demo's own FRED key
# (DEMO_FRED_API_KEY) is for openbb-data and demo-warm only, so every other service that reads
# the stack env file blanks both names. The preflight pins this on the rendered config.
x-no-fred: &no-fred
  OPENBB_FRED_API_KEY: ""
  DEMO_FRED_API_KEY: ""

networks:
  # Explicit subnet: a busy host can run out of Docker's predefined address
  # pools ("all predefined address pools have been fully subnetted"). Pick a
  # /24 that `docker network inspect` shows unused on the deploy host.
  default:
    ipam:
      config:
        - subnet: "${DEMO_SUBNET:?set DEMO_SUBNET in the stack env file to a free /24}"
  # The base file declares macro-net; the demo pins its subnet (same reason) and uses it for
  # one purpose: openbb-data (warm profile) <-> demo-warm. Only those two services attach.
  # Not `internal`: the sidecar needs egress to the free public macro providers. The backend,
  # nginx and the frontend are never on it (the preflight checks), so visitors cannot reach it.
  macro-net:
    ipam:
      config:
        - subnet: "${DEMO_MACRO_SUBNET:?set DEMO_MACRO_SUBNET in the stack env file to a second free /24, disjoint from DEMO_SUBNET}"

services:
  nginx:
    <<: *hardened
    # nginx's master needs these to bind :80 and drop to the worker user.
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    mem_limit: 32m
    cpus: 0.5
    ports: !override
      # LAN port (reached by the edge proxy). DEMO_BIND_ADDR must be the LAN
      # interface address; the preflight refuses 0.0.0.0.
      - "${DEMO_BIND_ADDR:-127.0.0.1}:${DEMO_PORT:-8190}:80"
    # Fava does not run in the demo (profile "never"), so drop it from the
    # base file's depends_on; the demo nginx has no fava upstream.
    depends_on: !override
      fastapi-backend:
        condition: service_healthy
      react-frontend:
        condition: service_started
    volumes:
      # Same target as the base file's nginx.conf mount: this one replaces it.
      - ./deploy/demo/nginx.demo.conf:/etc/nginx/nginx.conf:ro,z
      # The official image's envsubst entrypoint renders these templates at start.
      - ./deploy/demo/nginx-templates:/etc/nginx/templates:ro,z
    environment:
      # The one peer whose Cf-Connecting-Ip nginx believes (Traefik's address, a CIDR).
      # The default trusts nobody useful (loopback is not reachable from the LAN).
      DEMO_TRUSTED_PROXY: "${DEMO_TRUSTED_PROXY:-127.0.0.1/32}"
      # read_only rootfs: render into a tmpfs, not /etc/nginx/conf.d.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/demo-env
    tmpfs: [/var/cache/nginx, /var/run, /tmp, "/etc/nginx/demo-env:mode=0755,noexec,nosuid"]

  react-frontend:
    <<: *hardened
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    mem_limit: 64m
    cpus: 0.5
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    environment:
      <<: *no-fred

  fastapi-backend:
    <<: *hardened
    image: catallax-demo-backend:local
    mem_limit: 512m
    cpus: 1.0
    networks: !override [default]  # no macro-net: the backend has no route to openbb-data
    tmpfs: [/tmp]
    depends_on:  # merges with the base file's map: the sample rows land before the backend serves
      demo-seed:
        condition: service_completed_successfully
    environment:
      HOME: /tmp
      DEMO_MODE: "true"
      DEMO_READONLY: "true"  # never unlocked: demo-seed writes the sample rows, nothing else does
      DEMO_SAMPLE_READS: "true"  # serve the seeded rows (preflight pins it); DEMO_READONLY stays a pure write gate
      UPSTREAM_MODE: cache-only
      LLM_PROVIDER: noop
      SHARE_PASSPHRASE: ""
      WS_MAX_CONNECTIONS: "20"
      WS_MAX_LIFETIME_SECONDS: "900"
      FAVA_BASE_URL: http://fava:5001/fava
      # Fresh keys still expire quickly; the long-lived stale copy is what the
      # cache-only backend serves between warm runs (hourly outside market hours).
      QUOTE_STALE_TTL_SECONDS: "172800"
      <<: *no-fred

  stub-exporter:
    <<: *hardened
    image: catallax-demo-backend:local
    mem_limit: 128m
    cpus: 0.5
    tmpfs: [/tmp]

  postgres:
    <<: *hardened
    # The postgres entrypoint chowns the data dir and drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 256m
    cpus: 1.0
    tmpfs: [/tmp, /var/run/postgresql]
    environment:
      <<: *no-fred

  redis:
    <<: *hardened
    cap_add: [CHOWN, SETGID, SETUID]
    # Bound the cache under the container limit: public visitors cannot grow it past this.
    # Sizing (measured 2026-10-16: a full `demo_warm` into an empty Redis = 190 keys,
    # used_memory 8.7 MB, peak 9.0 MB, RSS 15 MB; every key carries a TTL, the stale copies
    # the cache-only backend depends on last 2 days (quotes) / 7 days (macro, markets, news)).
    # Cache-only mode never refetches, so an evicted warm key stays gone until the next warm.
    # 32 MB is 3.5x the warm set and keeps RSS (fragmentation ~1.8x at this size) well under
    # the 64m limit; 48 MB left too little margin for RSS spikes. volatile-ttl evicts the
    # SHORTEST-TTL keys first (rate-limit counters, short caches), so the long-lived stale
    # copies are the last to go; allkeys-lru would evict them on mere idleness. All warm
    # keys have a TTL, so volatile-ttl can always make room. Total stack budget unchanged.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "32mb", "--maxmemory-policy", "volatile-ttl"]
    mem_limit: 64m
    cpus: 0.5
    tmpfs: [/tmp]
    environment:
      <<: *no-fred

  # Never started: nothing in the demo reaches it (nginx answers /fava/ with 404).
  # Stays hardened in case someone activates the profile by hand.
  fava:
    <<: *hardened
    profiles: ["never"]
    mem_limit: 128m
    cpus: 0.5
    tmpfs: [/tmp]
    environment:
      BEANCOUNT_FILE: /data/ledger/main.bean
      <<: *no-fred
    # the sample ledger is already mounted :ro by the base file

  notes-mount-init:
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    read_only: true  # only writes into the mounted volume
    mem_limit: 16m
    cpus: 0.25

  # One-shot warm job: the ONLY upstream caller (it forces live mode inside the
  # process). Run by catallax-demo-warm.timer through compose.sh; never started
  # by `up` because it sits in the `warm` profile.
  demo-warm:
    <<: *hardened
    image: catallax-demo-backend:local
    profiles: ["warm"]
    command: ["python", "-m", "app.demo_warm"]
    env_file: .env
    environment:
      HOME: /tmp
      UPSTREAM_MODE: live
      LLM_PROVIDER: noop
      SHARE_PASSPHRASE: ""
      # The writer sets the stale-copy TTL: it must match the backend's reader.
      QUOTE_STALE_TTL_SECONDS: "172800"
      # Macro data is fetched by this job itself through the openbb-data sidecar.
      OPENBB_API_URL: http://openbb-data:6900
      # The demo's own free FRED key (optional; never the private install's). Without it the
      # keyless providers still warm and the FRED-only parts (bare FRED series, the economic
      # calendar) are skipped with a warning.
      OPENBB_FRED_API_KEY: ${DEMO_FRED_API_KEY:-}
      DEMO_FRED_API_KEY: ""  # the name is only the stack env file's; the job reads the line above
    networks: [default, macro-net]
    mem_limit: 256m
    cpus: 0.5
    tmpfs: [/tmp]
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Started with the job. Not service_healthy: the macro step polls the sidecar itself, so an
      # openbb-data that never comes up costs only the macro step, not the quotes and bars.
      openbb-data:
        condition: service_started
        required: false

  # Macro-data sidecar (warm profile only). demo-warm starts it with each run and the warm
  # scripts (warm-demo.sh, reset-demo.sh) stop it afterwards, so it holds no memory between
  # warms. Alone on macro-net with demo-warm; no host port.
  openbb-data:
    <<: *hardened
    profiles: ["warm"]
    networks: !override [macro-net]
    # Non-root; HOME=/tmp (a tmpfs) holds the FRED credential store the entrypoint writes.
    user: "10001:10001"
    environment:
      OPENBB_API_PORT: "6900"
      OPENBB_FRED_API_KEY: ${DEMO_FRED_API_KEY:-}
      HOME: /tmp
    tmpfs: [/tmp]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    restart: "no"

  # One-shot sample-artifact seed (DEMO-SPEC §13): migrates, then writes the synthetic
  # backtest/lab/journal/notes/watchlist/signals/algo/news rows straight into Postgres.
  # Runs on every `up` (the nightly reset re-seeds the wiped database); the backend
  # waits for it. app.demo_seed refuses unless DEMO_MODE, DEMO_READONLY and DEMO_SAMPLE_READS
  # are true and the seeded tables hold nothing but its own rows.
  demo-seed:
    <<: *hardened
    image: catallax-demo-backend:local
    command: ["sh", "-c", "alembic upgrade head && python -m app.demo_seed"]
    env_file: .env
    environment:
      HOME: /tmp
      DEMO_MODE: "true"
      DEMO_READONLY: "true"
      DEMO_SAMPLE_READS: "true"
      UPSTREAM_MODE: cache-only
      LLM_PROVIDER: noop
      SHARE_PASSPHRASE: ""
      <<: *no-fred
    mem_limit: 256m
    cpus: 0.5
    tmpfs: [/tmp]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Heavy / worker services stay off: the profile is never activated.
  report-worker:
    profiles: ["never"]
  backtester:
    profiles: ["never"]
  qlib-lab:
    profiles: ["never"]
  trading-engine:
    profiles: ["never"]
