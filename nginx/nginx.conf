# Catallax reverse proxy.
# Adding a service = one upstream block + one location block.
# Never rewrite existing blocks.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─── Upstreams (one per service) ─────────────────────────
    upstream fastapi_backend {
        server fastapi-backend:8000;
    }

    upstream react_frontend {
        server react-frontend:80;
    }

    upstream fava_app {
        server fava:5001;   # see docker-compose.yml fava.command — 5000 may be filtered on some hosts
    }

    server {
        listen 80;
        server_name _;

        # Shared proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (Vite HMR now, price ticker in Phase 2)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ─── /api → FastAPI backend ──────────────────────────
        location /api/ {
            # Shed oversized request bodies at the proxy before they reach the
            # ASGI stack (the layout-persistence PUT also caps at 256 KiB in-app).
            client_max_body_size 512k;
            proxy_pass http://fastapi_backend;
        }

        # ─── /fava → Fava (runs with --prefix /fava) ─────────
        # Gated (Phase 14 share path): auth_request delegates to the backend's
        # /auth/verify (cookie check + demo-mode fava block); a denied
        # sub-request never reaches Fava, so the raw ledger UI can't be an
        # accidental backdoor around the app's own API gate.
        location = /_auth {
            internal;
            proxy_pass http://fastapi_backend/api/v1/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }
        location /fava/ {
            auth_request /_auth;
            error_page 401 403 = @denied;
            proxy_pass http://fava_app;
        }
        location @denied {
            return 302 /;
        }

        # ─── / → React frontend ──────────────────────────────
        location / {
            proxy_pass http://react_frontend;
        }
    }
}
